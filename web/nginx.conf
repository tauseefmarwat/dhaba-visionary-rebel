server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location / { try_files $uri $uri/ /index.html; }
  # In Kubernetes ingress, route /api/menu, /api/orders, /api/stats and /info
  # to their corresponding Services. Do not proxy to localhost from this container.
}
