spring.application.name=kitchen-worker
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_DATABASE:dhaba_orders}
spring.datasource.username=${DB_USERNAME:dhaba}
spring.datasource.password=${DB_PASSWORD:dhaba_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver
worker.id=${WORKER_ID:local-worker}
app.version=${APP_VERSION:dev}
