name: CI

on:
  pull_request:
  push:
    branches: [main, ec2-staging]

permissions:
  contents: read

jobs:
  web:
    name: Web lint, tests, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run lint
      - run: npm test
      - run: npm run build

  menu-api:
    name: Menu API lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: menu-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: menu-api/requirements*.txt
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt ruff
      - run: ruff check .
      - run: pytest -q

  orders-api:
    name: Orders API format, vet, and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orders-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: orders-api/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...

  kitchen-worker:
    name: Kitchen worker tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kitchen-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn --batch-mode test

  stats-api:
    name: Stats API PHP tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, pdo_sqlite
          tools: composer:v2
      - name: Check PHP syntax
        run: find stats-api/overlay -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Prepare Laravel test application
        run: |
          composer create-project laravel/laravel:^13.0 stats-api/ci-app \
            --no-interaction --prefer-dist --no-progress
          cd stats-api/ci-app
          composer require predis/predis:^2.2 --no-interaction --no-progress
          rm -f tests/Feature/ExampleTest.php
          cp -R ../overlay/. .
          touch database/database.sqlite
          php artisan key:generate --force
      - name: Run PHPUnit tests
        working-directory: stats-api/ci-app
        run: php artisan test

  dockerfiles-and-shell:
    name: Dockerfile and shell script lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Dockerfiles
        run: |
          while IFS= read -r dockerfile; do
            docker run --rm -i hadolint/hadolint:v2.12.0 hadolint --failure-threshold error - < "$dockerfile"
          done < <(find . -name Dockerfile -not -path './.git/*' -print)
      - name: Lint shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck

  kubernetes-manifests:
    name: Kubernetes manifest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.36.0
      - name: Render and validate Kustomize overlays
        run: |
          for overlay in staging production; do
            kubectl kustomize "k8s/overlays/${overlay}" > "/tmp/${overlay}.yaml"
            docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 \
              -strict -summary - < "/tmp/${overlay}.yaml"
          done

  build-and-push:
    name: Build, scan, and push changed images
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ec2-staging')
    needs:
      - web
      - menu-api
      - orders-api
      - kitchen-worker
      - stats-api
      - dockerfiles-and-shell
      - kubernetes-manifests
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.changed.outputs.services }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find changed services
        id: changed
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            BEFORE_SHA=$(git hash-object -t tree /dev/null)
          fi

          services=()
          for service in web menu-api orders-api kitchen-worker stats-api postgres redis; do
            if ! git diff --quiet "$BEFORE_SHA" "$CURRENT_SHA" -- "$service/"; then
              services+=("$service")
            fi
          done

          if ! git diff --quiet "$BEFORE_SHA" "$CURRENT_SHA" -- scripts/build-and-push.sh; then
            services=(web menu-api orders-api kitchen-worker stats-api postgres redis)
            if [[ -d scripts/monitor ]]; then
              services+=(ops-monitor)
            fi
          elif [[ -d scripts/monitor ]] &&
               ! git diff --quiet "$BEFORE_SHA" "$CURRENT_SHA" -- ops-monitor/ scripts/monitor/; then
            services+=(ops-monitor)
          fi

          services_json=$(jq -cn --args '$ARGS.positional' "${services[@]}")
          echo "services=$services_json" >> "$GITHUB_OUTPUT"
          echo "Changed services: ${services[*]:-none}"
      - name: Configure AWS credentials with OIDC
        if: steps.changed.outputs.services != '[]'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN || 'arn:aws:iam::940482421289:role/GitHubActionsDhabaOrdersECR' }}
          aws-region: ${{ vars.AWS_REGION || 'eu-north-1' }}
      - name: Build and push images
        if: steps.changed.outputs.services != '[]'
        env:
          TEAM: ${{ vars.TEAM || 'visionary-rebel' }}
          AWS_REGION: ${{ vars.AWS_REGION || 'eu-north-1' }}
          AWS_ACCOUNT: ${{ vars.AWS_ACCOUNT || '940482421289' }}
          SERVICES_JSON: ${{ steps.changed.outputs.services }}
          GIT_SHA: ${{ github.sha }}
        run: |
          mapfile -t services < <(jq -r '.[]' <<< "$SERVICES_JSON")
          scripts/build-and-push.sh "${services[@]}"
      - name: Wait for ECR scans and reject critical findings
        if: steps.changed.outputs.services != '[]'
        env:
          TEAM: ${{ vars.TEAM || 'visionary-rebel' }}
          AWS_REGION: ${{ vars.AWS_REGION || 'eu-north-1' }}
          AWS_ACCOUNT: ${{ vars.AWS_ACCOUNT || '940482421289' }}
          SERVICES_JSON: ${{ steps.changed.outputs.services }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if [[ -z "$AWS_ACCOUNT" ]]; then
            AWS_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          fi

          scan_error=$(mktemp)
          trap 'rm -f "$scan_error"' EXIT
          critical_found=0
          scan_failed=0

          while IFS= read -r service; do
            repository="dhaba-${TEAM}/${service}"
            echo "Waiting for scan: ${repository}:${IMAGE_TAG}"
            findings=""
            status=""
            for attempt in {1..60}; do
              if findings=$(aws ecr describe-image-scan-findings \
                --region "$AWS_REGION" \
                --repository-name "$repository" \
                --image-id "imageTag=${IMAGE_TAG}" 2>"$scan_error"); then
                status=$(jq -r '.imageScanStatus.status // empty' <<< "$findings")
                if [[ "$status" == "COMPLETE" ]]; then
                  break
                elif [[ "$status" != "IN_PROGRESS" ]]; then
                  description=$(jq -r '.imageScanStatus.description // empty' <<< "$findings")
                  echo "Image scan failed for ${repository}:${IMAGE_TAG} (status: ${status:-unknown}; ${description:-no details})" >&2
                  cat "$scan_error" >&2
                  scan_failed=1
                  break
                fi
              elif ! grep -q "ScanNotFoundException" "$scan_error"; then
                cat "$scan_error" >&2
                scan_failed=1
                break
              fi

              if (( attempt == 60 )); then
                echo "Timed out waiting for ECR scan of ${repository}:${IMAGE_TAG}" >&2
                cat "$scan_error" >&2
                scan_failed=1
                break
              fi
              sleep 5
            done

            if [[ "$status" != "COMPLETE" ]]; then
              echo "Image scan did not complete for ${repository}:${IMAGE_TAG} (status: ${status:-unknown})" >&2
              scan_failed=1
              continue
            fi

            jq -r '.imageScanFindings.findingSeverityCounts // {} | to_entries[] | "  \(.key): \(.value)"' <<< "$findings"
            critical=$(jq -r '.imageScanFindings.findingSeverityCounts.CRITICAL // 0' <<< "$findings")
            high=$(jq -r '.imageScanFindings.findingSeverityCounts.HIGH // 0' <<< "$findings")
            echo "${repository}:${IMAGE_TAG} critical findings: ${critical}; high findings: ${high}"
            if (( critical > 0 || high > 0 )); then
              jq -r '.imageScanFindings.findings[]? | select(.severity == "CRITICAL" or .severity == "HIGH") | [.severity, .name, ([.attributes[]? | select(.key == "package_name" or .key == "package_version") | .value] | join("@"))] | @tsv' <<< "$findings"
            fi
            if (( critical > 0 )); then
              critical_found=1
            fi
          done < <(jq -r '.[]' <<< "$SERVICES_JSON")

          if (( scan_failed )); then
            echo "One or more image scans failed or did not complete." >&2
            exit 1
          fi
          if (( critical_found )); then
            echo "Critical ECR findings block this image set." >&2
            exit 1
          fi

  deploy-staging:
    name: Deploy changed images to EC2 Minikube staging
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/ec2-staging' &&
      needs.build-and-push.result == 'success' &&
      needs.build-and-push.outputs.services != '[]'
    needs:
      - build-and-push
    runs-on: ubuntu-latest
    environment: ec2-minikube-staging
    env:
      KUBECONFIG_B64: ${{ secrets.DEPLOYER_KUBECONFIG_B64 }}
      SERVICES_JSON: ${{ needs.build-and-push.outputs.services }}
      REGISTRY: ${{ vars.AWS_ACCOUNT || '940482421289' }}.dkr.ecr.${{ vars.AWS_REGION || 'eu-north-1' }}.amazonaws.com/dhaba-${{ vars.TEAM || 'visionary-rebel' }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.36.0
      - name: Configure kubectl credentials
        run: |
          if [[ -z "$KUBECONFIG_B64" ]]; then
            echo "Missing GitHub Actions secret DEPLOYER_KUBECONFIG_B64." >&2
            exit 1
          fi

          umask 077
          kubeconfig_file="$RUNNER_TEMP/deployer.kubeconfig"
          printf '%s' "$KUBECONFIG_B64" | base64 --decode > "$kubeconfig_file"
          echo "KUBECONFIG=$kubeconfig_file" >> "$GITHUB_ENV"
      - name: Deploy changed images to staging
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          while IFS= read -r service; do
            image="$REGISTRY/$service:$GIT_SHA"
            case "$service" in
              postgres|redis) resource="statefulset/$service" ;;
              web|menu-api|orders-api|kitchen-worker|stats-api) resource="deployment/$service" ;;
              *)
                echo "No Kubernetes workload is configured for service '$service'." >&2
                exit 1
                ;;
            esac

            kubectl get -n staging "$resource" >/dev/null
            kubectl set image -n staging "$resource" "$service=$image"
            kubectl rollout status -n staging "$resource" --timeout=5m
          done < <(jq -r '.[]' <<< "$SERVICES_JSON")

          kubectl get pods,ingress -n staging
